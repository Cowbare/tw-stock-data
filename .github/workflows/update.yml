
name: Update Taiwan Stocks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stock data
        id: stocks
        continue-on-error: true
        run: python -u update_stocks.py

      - name: Update institutional chips
        id: chips
        continue-on-error: true
        run: python -u update_chips.py

      - name: Commit available JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.stocks.outcome }}" = "success" ]; then
            git add data/
          fi

          if [ "${{ steps.chips.outcome }}" = "success" ]; then
            git add chips/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock and chip data"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Verify update results
        if: always()
        run: |
          echo "Stock result: ${{ steps.stocks.outcome }}"
          echo "Chip result: ${{ steps.chips.outcome }}"

          if [ "${{ steps.stocks.outcome }}" != "success" ] ||
             [ "${{ steps.chips.outcome }}" != "success" ]; then
            echo "One or more update scripts failed"
            exit 1
          fi
