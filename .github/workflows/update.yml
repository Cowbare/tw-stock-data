
name: Update Taiwan Stocks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stock data
        run: python update_stocks.py

      - name: Update institutional chips
        run: python update_chips.py

      - name: Commit JSON data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ chips/

          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock and chip data"
            git push
          else
            echo "No changes to commit"
          fi
          
